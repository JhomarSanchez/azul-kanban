<div class="panel-backdrop" (click)="close()"></div>
<section
  class="side-panel"
  [class.wide-panel]="wide()"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="label()"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="true"
>
  <header class="panel-header">
    <span class="panel-header-title"
      ><az-icon [name]="icon()" />{{ title() }}</span
    ><button
      class="icon-button"
      aria-label="Cerrar panel"
      [disabled]="busy()"
      (click)="close()"
    >
      <az-icon name="close" />
    </button>
  </header>
  <div class="panel-body"><ng-content /></div>
</section>
