name: Verify Azul
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: azul
          POSTGRES_PASSWORD: azul_test_only
          POSTGRES_DB: azul_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U azul -d azul_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://azul:azul_test_only@127.0.0.1:5432/azul_test
      OPENAI_API_KEY: ""
      APP_ORIGIN: http://127.0.0.1:4200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm db:migrate
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm test:integration && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance
        run: |
          pnpm dev > /tmp/azul-dev.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4200/ > /dev/null && curl -fsS http://127.0.0.1:3000/api/v1/health/ready > /dev/null; then break; fi
            sleep 2
          done
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: |
            .local/reports/playwright
            .local/reports/test-results
          include-hidden-files: true
